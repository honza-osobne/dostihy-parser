<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Text Extractor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
            background-color: #f4f4f9;
        }

        h2 {
            color: #333;
            text-align: center;
        }

        #drop-zone {
            border: 3px dashed #cbd5e0;
            border-radius: 12px;
            padding: 50px;
            text-align: center;
            background: white;
            transition: all 0.3s ease;
            cursor: pointer;
            margin-bottom: 20px;
        }

        #drop-zone.drag-over {
            border-color: #4299e1;
            background-color: #ebf8ff;
            transform: scale(1.02);
        }

        .status {
            font-weight: bold;
            margin-bottom: 10px;
            color: #4a5568;
        }

        #output {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            min-height: 200px;
            white-space: pre-wrap;
            /* Zachová formátování textu */
            max-height: 600px;
            overflow-y: auto;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .loader {
            display: none;
            color: #4299e1;
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <h2>PDF Extractor</h2>

    <div id="drop-zone">
        <p>Přetáhněte PDF soubor sem nebo <strong>klikněte pro výběr</strong></p>
        <input type="file" id="file-input" accept=".pdf" style="display: none;">
        <div id="loader" class="loader">Zpracovávám PDF...</div>
    </div>

    <div class="status" id="status-text">Připraveno</div>
    <div id="output">Zde se zobrazí extrahovaný text...</div>

    <script>
        // Konfigurace PDF.js workeru
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const output = document.getElementById('output');
        const statusText = document.getElementById('status-text');
        const loader = document.getElementById('loader');

        // Kliknutí na zónu vyvolá výběr souboru
        dropZone.addEventListener('click', () => fileInput.click());

        // Drag & Drop eventy
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            const file = e.dataTransfer.files[0];
            if (file && file.type === "application/pdf") {
                processPDF(file);
            } else {
                alert("Prosím, vložte platný PDF soubor.");
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files[0]) processPDF(e.target.files[0]);
        });

        // Hlavní funkce pro zpracování
        async function processPDF(file) {
            output.textContent = "";
            loader.style.display = "block";
            statusText.textContent = `Zpracovávám: ${file.name}`;

            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                let fullText = "";

                for (let i = 1; i <= pdf.numPages; i++) {
                    statusText.textContent = `Čtu stranu ${i} z ${pdf.numPages}...`;

                    const page = await pdf.getPage(i);
                    const textContent = await page.getTextContent();

                    // Extrakce textových řetězců
                    const pageText = textContent.items.map(item => item.str).join('#');
                    //fullText += `--- Strana ${i} ---\n${pageText}\n\n`;
                    fullText += `\n${pageText}\n\n`;
                }

                //output.textContent = fullText;
                const parser = new RaceResultParser(fullText);
                const structuredJson = parser.parse();

                output.textContent = JSON.stringify(structuredJson, null, 4) || "V PDF nebyl nalezen žádný čitelný text.";
                statusText.textContent = "Dokončeno.";
            } catch (error) {
                console.error(error);
                statusText.textContent = "Chyba při zpracování.";
                output.textContent = "Nepodařilo se přečíst PDF. Soubor může být poškozený nebo chráněný heslem.";
            } finally {
                loader.style.display = "none";
            }
        }

        class RaceResultParser {
            constructor(rawText) {
                // Normalizace: mřížky a zalomení řádků nahradíme mezerou
                this.normalizedText = rawText.replace(/[#\r\n]+/g, ' ').replace(/\s+/g, ' ');
            }

            parse() {
                const headerInfo = this.extractHeaderData(this.normalizedText);
                const results = {
                    datum: headerInfo.datum,
                    misto: headerInfo.misto,
                    dostihy: []
                };

                const raceBlocks = this.normalizedText.split(/(?=\d+\.\s*dostih)/);
                raceBlocks.forEach(block => {
                    if (block.includes("dostih")) {
                        results.dostihy.push(this.parseRace(block));
                    }
                });

                return results;
            }

            extractHeaderData(text) {
                const dateMatch = text.match(/(\d{1,2}\.\s*\d{1,2}\.\s*\d{4})/);
                const locationMatch = text.match(/(?:\d{4})\s+([A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ][a-záčďéěíňóřšťúůýž]+(?:\s+[A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ][a-záčďéěíňóřšťúůýž]+)*)/);
                return {
                    datum: dateMatch ? dateMatch[1].replace(/\s/g, '') : null,
                    misto: locationMatch ? locationMatch[1].trim() : "Neznámé místo"
                };
            }

            parseRace(block) {
                const headerMatch = block.match(/(\d+)\.\s*dostih\s+(\d+)\s*-\s*(.*?)(?=\s\(klusáci|\sklusáci)/);
                const paramsMatch = block.match(/(\(klusáci.*?\d+\s*Kč\))/);

                const race = {
                    cislo: headerMatch ? headerMatch[1] : null,
                    id: headerMatch ? headerMatch[2] : null,
                    nazev: headerMatch ? headerMatch[3].trim() : "",
                    parametry: paramsMatch ? paramsMatch[1] : "",
                    koně: [],
                    vysledky_info: {
                        vyrok_raw: this.extractValue(block, /Výrok:\s*(.*?)(?=\sČas:|$)/),
                        vyrok_parsed: [],
                        cas: this.extractValue(block, /Čas:\s*([\d:.]+)/)
                    },
                    sankce: this.extractSankce(block)
                };

                if (race.vysledky_info.vyrok_raw) {
                    race.vysledky_info.vyrok_parsed = this.parseVyrok(race.vysledky_info.vyrok_raw);
                }

                this.extractHorses(block, race);
                return race;
            }

            parseVyrok(vyrokStr) {
                if (!vyrokStr) return [];
                const typeMatch = vyrokStr.match(/^[A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ\s]+(?=\s\d|\shlava|\skr\.hlava|\sdaleko)/i);
                let type = "";
                let rest = vyrokStr;
                if (typeMatch) {
                    type = typeMatch[0].trim();
                    rest = vyrokStr.substring(type.length).trim();
                }
                const distances = rest.split(/\s*[\-\–\—]\s*/).map(d => d.trim()).filter(d => d);
                return type ? [type, ...distances] : distances;
            }

            extractHorses(block, race) {
                // 1. Předčištění: Odstraníme balast původu a normalizujeme mezery
                const cleanBlock = block.replace(/Původ:?\s*.*?Chovatel:?\s*.*?(?=[0-9]{4}|$)/gi, ' ')
                    .replace(/\s+/g, ' ');

                // 2. Extrakce koní - vylepšený regex, který zvládne i "přilepená" čísla na začátku
                // Skupina 1: ID (nepovinné), Skupina 2: Jméno, Skupina 3: Věk, Skupina 4: Pohlaví
                const horseRegex = /(?:\d{1,2})?(\d{4})\s+([A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ0-9\s']+(?:\([A-Z]+\))?)\s+(\d+)\s+([a-z]{2,5})/g;

                const horses = [];
                let hMatch;
                while ((hMatch = horseRegex.exec(cleanBlock)) !== null) {
                    horses.push({
                        identifikator: hMatch[1],
                        jmeno: hMatch[2].trim(),
                        vek: hMatch[3],
                        pohlavi: hMatch[4],
                        index: hMatch.index,
                        stats: null
                    });
                }

                // 3. Extrakce statistik - hledáme "kotvy" (dva časy XX.X za sebou a rok/distanci 1640/2140)
                const allStats = [];
                // Regex hledá: KM_ČAS (XX.X), 500M (XX.X), DISTANCE (1640/2140) a pak zbytek až po kurz
                const statsRegex = /(\d{2}\.\d)\s+(\d{2}\.\d)\s+(1640|2140|2640)\s+(.*?)\s+(\d+)\s+(\d+)\s+(\d+(?:,\d+)?)/g;

                let sMatch;
                while ((sMatch = statsRegex.exec(cleanBlock)) !== null) {
                    allStats.push({
                        km_cas: sMatch[1],
                        poslednich_500: sMatch[2],
                        distance: sMatch[3],
                        jezdec: sMatch[4].trim(),
                        startovni_cislo: sMatch[5],
                        poradi: sMatch[6],
                        kurz: sMatch[7].replace(',', '.')
                    });
                }

                // 4. Inteligentní párování
                horses.forEach((horse, i) => {
                    // A) Prvotní pokus: Shoda startovního čísla (nejspolehlivější)
                    // Hledáme v allStats takový záznam, kde se startovní číslo vyskytuje v okolí koně
                    let foundStats = allStats.find(s =>
                        cleanBlock.substring(horse.index, horse.index + 500).includes(s.startovni_cislo) &&
                        (s.km_cas.includes('.') || s.poslednich_500.includes('.'))
                    );

                    // B) Druhý pokus: Párování podle pořadí (pokud jich je stejně)
                    if (!foundStats && allStats.length === horses.length) {
                        foundStats = allStats[i];
                    }

                    // C) Třetí pokus: Hledání v bezprostředním okolí bez ohledu na startovní číslo
                    if (!foundStats) {
                        const searchArea = cleanBlock.substring(horse.index, horse.index + 600);
                        const backupMatch = searchArea.match(/(\d{2}\.\d)\s+(\d{2}\.\d)\s+(1640|2140|2640)\s+(.*?)\s+(\d+)\s+(\d+)\s+(\d+(?:,\d+)?)/);
                        if (backupMatch) {
                            foundStats = {
                                km_cas: backupMatch[1],
                                poslednich_500: backupMatch[2],
                                distance: backupMatch[3],
                                jezdec: backupMatch[4].trim(),
                                startovni_cislo: backupMatch[5],
                                poradi: backupMatch[6],
                                kurz: backupMatch[7].replace(',', '.')
                            };
                        }
                    }

                    if (foundStats) {
                        horse.stats = foundStats;
                    }

                    // Odstranění duplicit a uložení
                    if (!race.koně.some(h => h.jmeno === horse.jmeno)) {
                        const saveHorse = { ...horse };
                        delete saveHorse.index;
                        race.koně.push(saveHorse);
                    }
                });
            }
            extractSankce(block) {
                const match = block.match(/Sankce\s*:\s*(.*?)(?=Poplatek|Poznámka|Nestartující|Dostihová|$)/);
                if (!match) return [];
                return match[1].split(/(?=j\.)|(?=am\.)/).map(s => s.trim()).filter(s => s.length > 5);
            }

            extractValue(text, regex) {
                const match = text.match(regex);
                return match ? match[1].trim() : null;
            }
        }
    </script>
</body>

</html>
